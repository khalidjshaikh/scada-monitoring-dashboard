spring:
  application:
    name: meridian-scada
  datasource:
    url: jdbc:h2:mem:scada;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  h2:
    console:
      enabled: true
      path: /h2-console
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8082}
  compression:
    enabled: true
    mime-types: application/json,text/css,application/javascript,text/html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.meridian.scada: INFO
